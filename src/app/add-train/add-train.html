<div class="min-h-screen bg-slate-100 flex items-center justify-center px-4 py-10">

  <div class="w-full max-w-2xl">

    <!-- Header -->
    <div class="mb-6">

      <h1 class="text-3xl font-bold text-gray-800">
        Add New Train
      </h1>

      <p class="text-gray-500 mt-1">
        Add a new train to the Rail Yatra system
      </p>

    </div>


    <!-- Form Card -->
    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">

      <!-- Card Header -->
      <div class="bg-gradient-to-r from-blue-700 to-indigo-700 px-6 py-5 text-white">

        <div class="flex items-center gap-3">

          <div
            class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center text-2xl">
            🚆
          </div>

          <div>

            <h2 class="text-xl font-bold">
              Train Information
            </h2>

            <p class="text-blue-100 text-sm">
              Enter basic train details
            </p>

          </div>

        </div>

      </div>


      <!-- Form -->
      <form
        (ngSubmit)="addTrain()" [formGroup]="trainForm"
        class="p-6 space-y-6">


        <!-- Train Number -->
        <div>

          <label class="block text-sm font-semibold text-gray-700 mb-2">
            Train Number
          </label>

          <input
            type="text"
            name="trainNumber"
            formControlName="trainnumber"
            placeholder="Example: 12124"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl
                   focus:ring-2 focus:ring-blue-500
                   focus:border-blue-500
                   outline-none transition">

          <p class="text-xs text-gray-500 mt-2">
            Enter the unique train number.
          </p>

        </div>


        <!-- Train Name -->
        <div>

          <label class="block text-sm font-semibold text-gray-700 mb-2">
            Train Name
          </label>

          <input
            type="text"
            name="trainName"
            formControlName="trainname"
            placeholder="Example: Deccan Queen"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl
                   focus:ring-2 focus:ring-blue-500
                   focus:border-blue-500
                   outline-none transition">

        </div>


        <!-- Train Type -->
        <div>

          <label class="block text-sm font-semibold text-gray-700 mb-2">
            Train Type
          </label>

          <select
            name="trainType"
            formControlName="traintype"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl
                   focus:ring-2 focus:ring-blue-500
                   focus:border-blue-500
                   outline-none transition">

            <option value="">
              Select Train Type
            </option>

            <option value="EXPRESS">
              Express
            </option>

            <option value="SUPERFAST">
              Superfast
            </option>

            <option value="MAIL">
              Mail
            </option>

            <option value="PASSENGER">
              Passenger
            </option>

            <option value="SPECIAL">
              Special
            </option>

            <option value="VANDE_BHARAT">
              Vande Bharat
            </option>

          </select>

        </div>


        <!-- Buttons -->
        <div class="flex flex-col sm:flex-row gap-3 pt-4">

          <button
            type="submit"
            class="flex-1 bg-blue-600 hover:bg-blue-700
                   text-white font-semibold
                   py-3 rounded-xl
                   transition duration-200">

            + Add Train

          </button>

          <button
            type="button"
            (click)="resetForm()"
            class="flex-1 border border-gray-300
                   text-gray-700
                   hover:bg-gray-100
                   font-semibold
                   py-3 rounded-xl
                   transition duration-200">

            Reset

          </button>

        </div>

      </form>

    </div>


    <!-- Info -->
    <div class="mt-5 bg-blue-50 border border-blue-100 rounded-xl p-4">

      <div class="flex gap-3">

        <span class="text-xl">
          💡
        </span>

        <p class="text-sm text-blue-800">
          After adding the train, you can configure its
          route, stations, coaches and seat availability
          from the train management section.
        </p>

      </div>

    </div>

  </div>

</div>
