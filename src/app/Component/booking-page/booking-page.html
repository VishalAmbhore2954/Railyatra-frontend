<div class="min-h-screen bg-slate-100 py-8">

  <div class="max-w-7xl mx-auto px-4">

    <div class="grid lg:grid-cols-3 gap-6">

      <!-- LEFT SECTION -->
      <div class="lg:col-span-2 space-y-6">

        <!-- Journey Summary -->
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden">

          <div class="bg-blue-700 text-white px-6 py-4">

            <h2 class="text-2xl font-bold">
              Journey Summary
            </h2>

          </div>

          <div class="p-6">

            <div class="flex justify-between flex-wrap gap-4">

              <div>

                <h2 class="text-2xl font-bold">

                  {{train.trainName}}

                </h2>

                <p class="text-gray-500">

                  Train No. {{train.trainNo}}

                </p>

              </div>

              <div>

                <span class="bg-green-100 text-green-700 px-4 py-2 rounded-full">

                  {{train.class}}

                </span>

              </div>

            </div>

            <div class="grid md:grid-cols-3 mt-8 items-center">

              <div>

                <h3 class="text-4xl font-bold">

                  {{train.departure}}

                </h3>

                <p class="text-gray-500">

                  {{train.from}}

                </p>

              </div>

              <div class="text-center">

                <p class="text-gray-500">

                  {{train.duration}}

                </p>

                <div class="border-t-2 border-dashed my-3"></div>

                🚆

              </div>

              <div class="text-right">

                <h3 class="text-4xl font-bold">

                  {{train.arrival}}

                </h3>

                <p class="text-gray-500">

                  {{train.to}}

                </p>

              </div>

            </div>

            <div class="mt-8 grid md:grid-cols-3 gap-6">

              <div>

                <label class="text-sm text-gray-500">

                  Journey Date

                </label>

                <p class="font-semibold">

                  {{train.journeyDate}}

                </p>

              </div>

              <div>

                <label class="text-sm text-gray-500">

                  Coach

                </label>

                <p class="font-semibold">

                  {{train.coach}}

                </p>

              </div>

              <div>

                <label class="text-sm text-gray-500">

                  Class

                </label>

                <p class="font-semibold">

                  {{train.class}}

                </p>

              </div>

            </div>

          </div>

        </div>

        <!-- Passenger Details -->

        <div class="bg-white rounded-2xl shadow-lg overflow-hidden">

          <div class="bg-indigo-600 text-white px-6 py-4 flex justify-between items-center">

            <h2 class="text-2xl font-bold">

              Passenger Details

            </h2>

            <button

              (click)="addPassenger()"

              class="bg-white text-indigo-600 px-5 py-2 rounded-lg font-semibold hover:bg-gray-100">

              + Add Passenger

            </button>

          </div>

          <div class="p-6">

            <div

              *ngFor="let passenger of passengers; let i=index"

              class="border rounded-2xl p-6 mb-6">

              <div class="flex justify-between items-center mb-6">

                <h3 class="font-bold text-xl">

                  Passenger {{i+1}}

                </h3>

                <button

                  *ngIf="passengers.length>1"

                  (click)="removePassenger(i)"

                  class="text-red-600 font-semibold">

                  Remove

                </button>

              </div>

              <div class="grid md:grid-cols-2 gap-6">

                <!-- Name -->

                <div>

                  <label class="block mb-2 font-medium">

                    Full Name

                  </label>

                  <input

                    [(ngModel)]="passenger.name"

                    class="w-full border rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none"

                    placeholder="Enter passenger name">

                </div>

                <!-- Age -->

                <div>

                  <label class="block mb-2 font-medium">

                    Age

                  </label>

                  <input

                    [(ngModel)]="passenger.age"

                    type="number"

                    class="w-full border rounded-xl p-3">

                </div>

                <!-- Gender -->

                <div>

                  <label class="block mb-2 font-medium">

                    Gender

                  </label>

                  <select

                    [(ngModel)]="passenger.gender"

                    class="w-full border rounded-xl p-3">

                    <option>Male</option>

                    <option>Female</option>

                    <option>Other</option>

                  </select>

                </div>

                <!-- Berth -->

                <div>

                  <label class="block mb-2 font-medium">

                    Berth Preference

                  </label>

                  <select

                    [(ngModel)]="passenger.berth"

                    class="w-full border rounded-xl p-3">

                    <option>Lower</option>

                    <option>Middle</option>

                    <option>Upper</option>

                    <option>Side Lower</option>

                    <option>Side Upper</option>

                    <option>No Preference</option>

                  </select>

                </div>

              </div>

            </div>

          </div>

        </div>

      </div>

      <!-- RIGHT SECTION -->
      <!-- Leave this empty for now -->
      <!-- We'll add Contact Details + Fare Summary + Payment in Part 3 -->

      <div class="space-y-6">

      </div>

    </div>

  </div>

</div>
