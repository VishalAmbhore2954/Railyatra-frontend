<div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-blue-100 flex items-center justify-center px-4 py-8">

  <div class="w-full max-w-5xl bg-white rounded-3xl shadow-2xl overflow-hidden grid lg:grid-cols-2">

    <!-- Left Side -->
    <div
      class="hidden lg:flex flex-col justify-center bg-gradient-to-br from-blue-700 to-indigo-700 text-white p-12">

      <h1 class="text-5xl font-bold mb-4">
        Rail Yatra
      </h1>

      <p class="text-lg text-blue-100 leading-8">
        Book train tickets quickly and securely.
        Travel across India with comfort and convenience.
      </p>

      <img
        src="assets/images/train.svg"
        alt="Train"
        class="mt-10 w-full max-w-md self-center">
    </div>

    <!-- Right Side -->
    <div class="p-8 sm:p-12">

      <div class="lg:hidden text-center mb-8">
        <h2 class="text-4xl font-bold text-blue-700">
          Rail Yatra
        </h2>
        <p class="text-gray-500 mt-2">
          Login to continue
        </p>
      </div>

      <div class="max-w-md mx-auto">

        <h2 class="hidden lg:block text-3xl font-bold text-gray-800 mb-2">
          Welcome Back 👋
        </h2>

        <p class="hidden lg:block text-gray-500 mb-8">
          Login to your account
        </p>

        <form class="space-y-6">

          <!-- Email -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">
              Email Address
            </label>

            <input
              type="email"
              placeholder="Enter your email"
              class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
          </div>

          <!-- Password -->
          <div>

            <div class="flex justify-between mb-2">
              <label class="text-sm font-semibold text-gray-700">
                Password
              </label>

              <a href="#" class="text-blue-600 text-sm hover:underline">
                Forgot Password?
              </a>
            </div>

            <input
              type="password"
              placeholder="Enter your password"
              class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">

          </div>

          <!-- Remember -->
          <div class="flex items-center justify-between">

            <label class="flex items-center gap-2 text-gray-600 text-sm">

              <input
                type="checkbox"
                class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">

              Remember me

            </label>

          </div>

          <!-- Login -->
          <button
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition duration-300 shadow-lg">
            Login
          </button>

          <!-- Divider -->
          <div class="flex items-center">

            <div class="flex-1 border-b"></div>

            <span class="px-4 text-gray-400 text-sm">
              OR
            </span>

            <div class="flex-1 border-b"></div>

          </div>

          <!-- Google -->
          <button
            type="button"
            class="w-full border border-gray-300 rounded-xl py-3 flex items-center justify-center gap-3 hover:bg-gray-50 transition">

            <img
              src="https://www.svgrepo.com/show/475656/google-color.svg"
              class="w-5 h-5">

            Continue with Google

          </button>

          <!-- Register -->
          <p class="text-center text-gray-600 text-sm">

            Don't have an account?

            <a
              href="#"
              class="text-blue-600 font-semibold hover:underline">
              Register
            </a>

          </p>

        </form>

      </div>

    </div>

  </div>

</div>
